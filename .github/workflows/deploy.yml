name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CDK stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-northeast-1
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
      SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
      SWITCHBOT_DEVICE_ID: ${{ secrets.SWITCHBOT_DEVICE_ID }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate deployment settings
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN SWITCHBOT_TOKEN SWITCHBOT_SECRET SWITCHBOT_DEVICE_ID ALLOWED_EMAILS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub setting ${name} is not configured."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Check Lambda code
        run: python -m py_compile lambda/lambda_function.py

      - name: Build CDK application
        run: npm run build

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Deploy
        shell: bash
        run: |
          npx cdk deploy Takoyaki3LockStack \
            --require-approval never \
            --parameters "SwitchBotToken=${SWITCHBOT_TOKEN}" \
            --parameters "SwitchBotSecret=${SWITCHBOT_SECRET}" \
            --parameters "SwitchBotDeviceId=${SWITCHBOT_DEVICE_ID}" \
            --parameters "AllowedEmails=${ALLOWED_EMAILS}"
