openapi: 3.0.3
info:
  title: Takoyaki3 SwitchBot API
  version: 2.0.0
  description: Firebase JWTで保護された、SwitchBotデバイスの登録・状態取得・操作API。
servers:
  - url: https://irk08qz577.execute-api.ap-northeast-1.amazonaws.com/prod
security:
  - firebaseJwt: []
paths:
  /catalog/devices:
    get:
      summary: SwitchBotアカウントに登録されたデバイス一覧を取得
      operationId: listSwitchBotDevices
      responses:
        "200":
          description: 物理デバイスと赤外線リモコンの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/CatalogDevice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /devices:
    get:
      summary: APIに設定済みの論理デバイス一覧を取得
      operationId: listConfiguredDevices
      responses:
        "200":
          description: 設定済みデバイス一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/ConfiguredDevice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /devices/{device}:
    parameters:
      - $ref: "#/components/parameters/DeviceName"
    put:
      summary: 任意の論理名称でSwitchBotデバイスを設定または更新
      operationId: putDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, kind]
              additionalProperties: false
              properties:
                deviceId: {type: string}
                kind: {type: string, enum: [lock, power]}
      responses:
        "200": {description: 保存した設定, content: {application/json: {schema: {$ref: "#/components/schemas/ConfiguredDevice"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      summary: 論理デバイス設定を削除
      operationId: deleteDevice
      responses:
        "200": {description: 削除完了}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /devices/{device}/status:
    parameters:
      - $ref: "#/components/parameters/DeviceName"
    get:
      summary: 設定済みデバイスの状態を取得
      operationId: getDeviceStatus
      responses:
        "200": {description: SwitchBotの状態, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /devices/{device}/actions:
    parameters:
      - $ref: "#/components/parameters/DeviceName"
    post:
      summary: 設定済みデバイスを操作
      description: kind=lockではlock/unlock、kind=powerではon/offだけを受け付けます。
      operationId: operateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: {type: string, enum: [lock, unlock, on, off]}
      responses:
        "200": {description: コマンド送信完了}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    firebaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token。Lambda Authorizerが公開鍵、署名、issuer、audience、有効期限を検証します。
  parameters:
    DeviceName:
      name: device
      in: path
      required: true
      description: 利用者が設定した1～64文字の論理名称（スラッシュ不可）
      schema: {type: string, minLength: 1, maxLength: 64}
  schemas:
    CatalogDevice:
      type: object
      required: [deviceId, deviceName, deviceType, source]
      properties:
        deviceId: {type: string}
        deviceName: {type: string}
        deviceType: {type: string}
        source: {type: string, enum: [physical, infrared]}
    ConfiguredDevice:
      type: object
      required: [device_name, device_id, kind, actions]
      properties:
        device_name: {type: string}
        device_id: {type: string}
        kind: {type: string, enum: [lock, power]}
        switchbot_name: {type: string}
        device_type: {type: string}
        source: {type: string, enum: [physical, infrared]}
        actions: {type: array, items: {type: string, enum: [lock, unlock, on, off]}}
    Error:
      type: object
      required: [message]
      properties: {message: {type: string}}
  responses:
    BadRequest: {description: 入力が不正, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthorized: {description: JWTがない、または検証失敗, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: 許可メールアドレスに含まれない, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: 論理デバイスが未設定, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
