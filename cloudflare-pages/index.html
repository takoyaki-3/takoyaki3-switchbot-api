<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Takoyaki3 Home</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#f7f3eb;background:#101110;color-scheme:dark}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 18px;background:radial-gradient(circle at 10% 0,#6e342755,transparent 35rem),#101110}
    main{width:min(960px,100%);margin:auto}header,.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{margin:.2rem 0;font-size:clamp(1.6rem,5vw,2.5rem)}h2{font-size:1.1rem}p{color:#bbb4aa}.panel,.card{background:#1b1c1a;border:1px solid #343630;border-radius:18px;padding:18px;box-shadow:0 12px 35px #0003}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0 28px}
    button{font:inherit;border:0;border-radius:10px;padding:.72rem .85rem;background:#e97443;color:#17100c;font-weight:700;cursor:pointer}button.secondary{background:#343731;color:#eee}button:disabled{opacity:.45;cursor:wait}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:1.4em;color:#d8cfc4}.muted{font-size:.84rem;color:#999187}.empty{padding:26px;text-align:center;color:#999}.notice{min-height:1.5rem;color:#f0b090}
  </style>
</head>
<body><main>
  <header><div><p class="muted">STATELESS DEVICE CONTROL</p><h1>Takoyaki3 Home</h1></div><button id="reload" class="secondary">再読み込み</button></header>
  <div id="notice" class="notice"></div>
  <section><div class="row"><h2>SwitchBotデバイス</h2><p class="muted">名称と操作種別はSwitchBotから自動取得します。</p></div><div id="devices" class="grid"><div class="empty panel">認証を確認しています…</div></div></section>
</main><script>
// CloudFrontがdevicesパスをAPI Gatewayへ転送するため、環境固有URLは不要。
const API='';
const LOGIN_URL='http://takoyaki3-auth.web.app/?r=https://home-switchbot.app.takoyaki3.com/';
const params=new URLSearchParams(location.search);
let jwt=(params.get('jwt')||'').trim();
if(params.has('jwt'))history.replaceState(null,'',location.pathname+location.hash);
const $=selector=>document.querySelector(selector);
const notice=message=>$('#notice').textContent=message;
function login(){location.replace(LOGIN_URL)}
async function api(path,options={}){
  const response=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json',...(options.headers||{})}});
  let body={};try{body=await response.json()}catch{}
  if(response.status===401){jwt='';login();throw new Error('認証が必要です')}
  if(!response.ok)throw new Error(body.message||`API error (${response.status})`);return body;
}
const ACTION_LABELS={lock:'施錠',unlock:'解錠',on:'ON',off:'OFF'};
const KIND_LABELS={lock:'鍵',power:'電源',readonly:'参照のみ'};
function render(devices){
  const root=$('#devices');root.replaceChildren();
  if(!devices.length){root.innerHTML='<div class="empty panel">SwitchBotデバイスはありません</div>';return}
  for(const device of devices){
    const card=document.createElement('article');card.className='card';
    const title=document.createElement('h2');title.textContent=device.deviceName||'(名称なし)';
    const meta=document.createElement('p');meta.className='muted';meta.textContent=`${device.deviceType} · ${KIND_LABELS[device.kind]} · ${device.source}`;
    const status=document.createElement('div');status.className='status';status.textContent='状態未取得';
    const buttons=document.createElement('div');buttons.className='actions';
    for(const action of device.actions){const label=ACTION_LABELS[action]||action;const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{if(action==='unlock'&&!confirm(`${device.deviceName}を解錠しますか？`))return;button.disabled=true;try{await api(`/devices/${encodeURIComponent(device.deviceId)}/actions`,{method:'POST',body:JSON.stringify({action})});status.textContent=`${label}を送信しました`}catch(e){status.textContent=e.message}finally{button.disabled=false}};buttons.append(button)}
    if(device.supportsStatus){const refresh=document.createElement('button');refresh.className='secondary';refresh.textContent='状態';refresh.onclick=async()=>{refresh.disabled=true;try{const value=await api(`/devices/${encodeURIComponent(device.deviceId)}/status`);status.textContent=value.lockState||value.power||value.deviceMode||JSON.stringify(value)}catch(e){status.textContent=e.message}finally{refresh.disabled=false}};buttons.append(refresh)}
    if(!device.actions.length&&!device.supportsStatus)status.textContent='このAPIで利用できる操作はありません';
    card.append(title,meta,status,buttons);root.append(card)
  }
}
async function loadDevices(){try{notice('読み込み中…');const data=await api('/devices');render(data.devices);notice('')}catch(e){notice(e.message)}}
$('#reload').onclick=loadDevices;
if(jwt)loadDevices();else login();
</script></body></html>
